# microservices-frontend-service (this repo).
# Builds the static React/Vite site and serves it with nginx on :8080.
#
# NOTE: The /api/auth and /api/payment calls are routed by the cluster
# ingress/gateway in a real deployment. For full local development against the
# backends, prefer `npm run dev` (Vite dev server proxies /api/* — see
# vite.config.ts). This compose file just serves the production bundle.
#
# One-time, before the first `up` (shared by all repos):
#   docker network create microservices-net
#
#   docker compose up -d --build
#   open http://localhost:8088

services:
  frontend:
    build: .
    image: microservices-frontend-service:local
    container_name: frontend
    ports:
      # Host 8088 -> container 8080 (nginx-unprivileged listens on 8080).
      - "8088:8080"
    networks:
      - microservices-net
    restart: unless-stopped

networks:
  microservices-net:
    external: true
