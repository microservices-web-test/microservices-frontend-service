worker_processes  auto;
pid /tmp/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  server {
    listen       8080;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Docker's embedded DNS (resolves container names on microservices-net).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
      access_log off;
      add_header Content-Type application/json;
      return 200 '{"status":"ok"}';
    }

    # NOTE: hostnames must match the container names (or compose service
    # aliases) of your auth/payment containers, and their internal ports.
    location = /api/auth {
      set $auth_upstream "auth-service:3000";
      rewrite ^/api/auth$ / break;
      proxy_pass http://$auth_upstream;
      proxy_set_header Host $host;
    }

    location = /api/payment {
      set $payment_upstream "payment-service:5000";
      rewrite ^/api/payment$ / break;
      proxy_pass http://$payment_upstream;
      proxy_set_header Host $host;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}

