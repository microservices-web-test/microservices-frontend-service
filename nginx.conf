worker_processes  auto;
pid /tmp/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout  65;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  server {
    listen       8080;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Resolve in-cluster Service names via k3s CoreDNS (ClusterIP 10.43.0.10).
    # Using a resolver + variable upstreams means nginx starts even if a
    # backend Service does not exist yet (requests just 502 until it does),
    # instead of failing to boot on an unresolvable host.
    resolver 10.43.0.10 valid=10s ipv6=off;

    # Kubernetes liveness/readiness probe endpoint.
    location = /healthz {
      access_log off;
      add_header Content-Type application/json;
      return 200 '{"status":"ok"}';
    }

    # ---- Backend-for-Frontend (BFF) proxy ----
    # The browser calls same-origin /api/auth and /api/payment; nginx forwards
    # them to the internal ClusterIP Services (which serve their payload at "/").
    location = /api/auth {
      set $auth_upstream "auth-service.microservices.svc.cluster.local:3000";
      rewrite ^/api/auth$ / break;
      proxy_pass http://$auth_upstream;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/payment {
      set $payment_upstream "payment-service.microservices.svc.cluster.local:5000";
      rewrite ^/api/payment$ / break;
      proxy_pass http://$payment_upstream;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long-cache fingerprinted static assets produced by Vite.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # SPA fallback: every other route serves index.html so client-side
    # routing works.
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}
